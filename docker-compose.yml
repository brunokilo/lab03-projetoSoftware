services:
  banco:
    image: postgres:16
    container_name: moeda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moeda_estudantil
    ports:
      - "5432:5432"
    volumes:
      - moeda_dados:/var/lib/postgresql/data

volumes:
  moeda_dados: